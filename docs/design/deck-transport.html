    --shadow-raised: 0 3px 6px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -2px 3px rgba(0,0,0,0.45);
    --shadow-pressing: 0 1px 2px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    --shadow-sunk: inset 0 3px 5px rgba(0,0,0,0.75), inset 0 -2px 3px rgba(255,255,255,0.09);
    --shadow-float: 0 8px 28px -4px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--on-face);
    font-family: "Roboto", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: flex-end;
    user-select: none; overflow: hidden;
  }
  /* RN Pressables have no chrome — strip the browser's before it draws boxes
     around every segment and phase band. */
  button {
    font-family: inherit; color: inherit;
    border: none; background: none; padding: 0; appearance: none;
  }

  /* Stand-in for the video behind the console. In the app this is footage. */
  .picture {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(90% 55% at 50% 32%, rgba(97, 132, 87, 0.30), rgba(97,132,87,0) 70%),
      linear-gradient(180deg, #1a231c 0%, #131a15 50%, #0a0e0b 80%, var(--ground) 100%);
  }

  /* ---- console scrim: gradient over the picture; only controls take touches - */
  .console {
    position: relative; z-index: 1; padding-top: 72px;
    background: linear-gradient(180deg, rgba(5,7,6,0) 0%, rgba(5,7,6,0.86) 42%, var(--ground) 100%);
  }
  .timeline { padding: 0 20px; }

  /* ---- readout: `Downswing · 184` — where you are is a name, not a picture -- */
  .readout { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 7px; }
  .where-phase { color: var(--on-face); font-size: 13px; font-weight: 700; letter-spacing: -0.2px; }
  .where-frame { color: var(--accent); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; margin-left: 7px; }
  .time { color: var(--quiet); font-size: 11px; font-variant-numeric: tabular-nums; }
  .time .total { color: var(--dim); }

  /* ---- the ONE box every position reads. Nothing inset, nothing gapped. ---- */
  .track-box { position: relative; }

  /* phase strip: 6pt, drawn to scale, dividers drawn INSIDE the band (no gaps) */
  .phase-strip { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--glass-key); }
  .phase-seg { position: relative; flex-basis: 0; padding: 0; background: none; cursor: pointer; }
  .phase-band { height: 6px; opacity: 0.75; }
  .phase-seg.padding .phase-band { opacity: 0.28; }
  .phase-seg.active .phase-band { opacity: 1; }
  .phase-divider { position: absolute; top: 0; right: 0; bottom: 0; width: 1px; background: var(--glass-sheet); }

  /* scrub: 3pt hairline track, 40pt touch, 20pt ring thumb (5pt stroke) */
  .scrub-touch { position: relative; height: 40px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  .scrub-track { width: 100%; height: 3px; border-radius: 1.5px; background: rgba(255,255,255,0.18); overflow: hidden; }
  .scrub-fill { height: 100%; background: var(--accent); }
  .scrub-thumb {
    position: absolute; width: 20px; height: 20px; border-radius: 10px; margin-left: -10px;
    border: 5px solid var(--accent); background: #0b0e0c; pointer-events: none;
  }
  .scrub-touch:focus-visible { outline: none; }
  .scrub-touch:focus-visible .scrub-thumb { box-shadow: 0 0 0 3px rgba(184,255,74,0.35); }

  /* playhead: 2pt accent line, glow, terminates at the thumb (SCRUB_TOUCH / 2) */
  .playhead {
    position: absolute; top: -3px; bottom: 20px; width: 2px; margin-left: -1px;
    background: var(--accent); pointer-events: none;
    box-shadow: 0 0 10px rgba(184,255,74,0.5);
  }

  /* ---- the dock: 70pt, radius 28, floating ------------------------------- */
  .dock-wrap { padding: 10px 16px 20px; }
  .dock {
    position: relative; height: 70px; border-radius: 28px;
    background: var(--glass-dock); box-shadow: var(--shadow-float);
  }

  /* speed well: recessed, fixed 42pt segments, sliding pill */
  .well {
    position: absolute; left: 12px; top: 13px; display: flex; align-items: center;
    width: 134px; height: 44px; border-radius: 15px; padding: 4px;
    background: var(--glass-well); box-shadow: var(--shadow-sunk);
  }
  .well-pill {
    position: absolute; left: 4px; top: 4px; width: 42px; height: 36px; border-radius: 11px;
    background: rgba(184,255,74,0.16);
    transition: transform 320ms cubic-bezier(0.2, 1.4, 0.4, 1);
  }
  .segment {
    width: 42px; height: 100%; display: grid; place-items: center; position: relative;
    background: none; padding: 0; cursor: pointer;
    color: var(--caption); font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .segment[aria-pressed="true"] { color: var(--accent); }
  .segment:focus-visible { outline: 2px solid rgba(184,255,74,0.5); outline-offset: -2px; border-radius: 11px; }

  /* play cap: 54pt, the one round cap, the one warm cap. Pause is play, pushed in. */
  .play-cap {
    position: absolute; left: 50%; top: 8px; width: 54px; height: 54px; margin-left: -27px;
    border-radius: 999px; display: grid; place-items: center; cursor: pointer; padding: 0;
    background: linear-gradient(180deg, var(--primary-top) 0%, var(--primary-bottom) 100%);
    box-shadow: var(--shadow-raised);
  }
  .play-cap:active { box-shadow: var(--shadow-pressing); transform: translateY(2px); }  /* DECK.travel */
  .play-cap.sunk {
    background: linear-gradient(180deg, var(--primary-sunk-top) 0%, var(--primary-sunk-bottom) 100%);
    box-shadow: var(--shadow-sunk); transform: translateY(2px);
  }
  .play-cap:focus-visible { outline: 2px solid rgba(184,255,74,0.6); outline-offset: 3px; }

  /* glyphs — drawn, not imported. Triangle = border trick, optically centred. */
  .glyph-play {
    width: 0; height: 0; margin-left: 3px;
    border-top: 10px solid transparent; border-bottom: 10px solid transparent;
    border-left: 17px solid var(--on-primary);
  }
  .glyph-pause { display: flex; gap: 4.5px; }
  .glyph-pause i { display: block; width: 5.3px; height: 19px; border-radius: 2px; background: var(--on-primary); }
  .glyph-bars { display: flex; align-items: flex-end; gap: 2.7px; height: 16px; }
  .glyph-bars i { display: block; width: 2.1px; border-radius: 1px; background: var(--caption); }
  .glyph-bars i:nth-child(1) { height: 7px; }
  .glyph-bars i:nth-child(2) { height: 16px; }
  .glyph-bars i:nth-child(3) { height: 11px; }
  .glyph-spark { position: relative; width: 17px; height: 17px; }
  .glyph-spark i { position: absolute; display: block; background: var(--accent); transform: rotate(45deg); }
  .glyph-spark i:nth-child(1) { width: 10.2px; height: 10.2px; left: 0.7px; top: 2.7px; border-radius: 1.6px; }
  .glyph-spark i:nth-child(2) { width: 5.1px; height: 5.1px; left: 10.5px; top: 0; border-radius: 0.8px; opacity: 0.75; }

  /* dock actions: a glyph over a caption, equal widths so the pair reads as one */
  .dock-right { position: absolute; right: 12px; top: 12px; display: flex; align-items: center; gap: 6px; }
  .dock-action {
    width: 52px; height: 46px; border-radius: 15px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 5px; background: none; padding: 0; cursor: pointer;
  }
  .dock-action:active { opacity: 0.5; }
  .dock-action:focus-visible { outline: 2px solid rgba(184,255,74,0.5); outline-offset: -2px; }
  .dock-caption {
    color: var(--caption); font-size: 7px; font-weight: 700;
    letter-spacing: 1.1px; text-transform: uppercase;
  }
  .dock-action.accent .dock-caption { color: var(--accent); }

  @media (prefers-reduced-motion: reduce) { .well-pill { transition: none; } }
</style>

<div class="picture"></div>

<div class="console">
  <div class="timeline">
    <div class="readout">
      <div>
        <span class="where-phase" id="where-phase">Backswing</span><span class="where-frame" id="where-frame">150</span>
      </div>
      <div class="time"><span id="time-now">1.00s</span><span class="total"> / <span id="time-total">5.10s</span></span></div>
    </div>

    <div class="track-box">
      <div class="phase-strip" id="phase-strip"></div>
      <div class="scrub-touch" id="scrub" tabindex="0" role="slider"
           aria-label="Swing position" aria-valuemin="90" aria-valuemax="396" aria-valuenow="150">
        <div class="scrub-track"><div class="scrub-fill" id="scrub-fill"></div></div>
        <div class="scrub-thumb" id="scrub-thumb"></div>
      </div>
      <div class="playhead" id="playhead"></div>
    </div>
  </div>

  <div class="dock-wrap">
    <div class="dock">
      <div class="well">
        <div class="well-pill" id="well-pill"></div>
        <button class="segment" data-speed="1" aria-pressed="true">1x</button>
        <button class="segment" data-speed="0.5" aria-pressed="false">0.5x</button>
        <button class="segment" data-speed="0.1" aria-pressed="false">0.1x</button>
      </div>

      <button class="play-cap" id="play" aria-label="Play">
        <span class="glyph-play" id="play-glyph"></span>
        <span class="glyph-pause" id="pause-glyph" style="display:none"><i></i><i></i></span>
      </button>

      <div class="dock-right">
        <button class="dock-action" aria-label="Metrics">
          <span class="glyph-bars"><i></i><i></i><i></i></span>
          <span class="dock-caption">Metrics</span>
        </button>
        <button class="dock-action accent" aria-label="Analysis">
          <span class="glyph-spark"><i></i><i></i></span>
          <span class="dock-caption">Analysis</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  // Demo swing = swing1's shape: window opens at frame 90 of 396, 60 fps.
  const FPS = 60;
  const FIRST = 90, LAST = 396;
  const BANDS = [
    { key: "setup",     label: "Setup",     from: 90,  to: 150, color: "var(--band-pad)",       padding: true  },
    { key: "backswing", label: "Backswing", from: 150, to: 240, color: "var(--band-backswing)", padding: false },
    { key: "downswing", label: "Downswing", from: 240, to: 262, color: "var(--band-downswing)", padding: false },
    { key: "through",   label: "Through",   from: 262, to: 320, color: "var(--band-through)",   padding: false },
    { key: "runout",    label: "Run-out",   from: 320, to: 396, color: "var(--band-pad)",       padding: true  },
  ];
  const PADDING_SCRUB_WEIGHT = 0.3; // phaseBands.ts

  // ---- the ONE x↔frame mapping (scrubMap) — weighted, padding compressed ----
  const weights = BANDS.map(b => (b.to - b.from) * (b.padding ? PADDING_SCRUB_WEIGHT : 1));
  const total = weights.reduce((n, w) => n + w, 0);
  const offsets = weights.reduce((acc, w) => (acc.push(acc[acc.length - 1] + w), acc), [0]);

  function toFraction(frame) {
    const f = Math.min(LAST, Math.max(FIRST, frame));
    for (let i = 0; i < BANDS.length; i++) {
      const b = BANDS[i];
      if (f <= b.to || i === BANDS.length - 1) {
        const within = (f - b.from) / Math.max(1, b.to - b.from);
        return (offsets[i] + Math.min(1, Math.max(0, within)) * weights[i]) / total;
      }
    }
    return 1;
  }
  function toFrame(fraction) {
    const x = Math.min(1, Math.max(0, fraction)) * total;
    for (let i = 0; i < BANDS.length; i++) {
      if (x <= offsets[i + 1] || i === BANDS.length - 1) {
        const within = (x - offsets[i]) / Math.max(1e-6, weights[i]);
        return Math.round(BANDS[i].from + within * (BANDS[i].to - BANDS[i].from));
      }
    }
    return LAST;
  }
  const activeBand = f => BANDS.findIndex(b => f >= b.from && f < b.to);

  // ---- state ----------------------------------------------------------------
  let frame = 150, playing = false, speed = 1, raf = null, lastT = 0, acc = 0;
  const $ = id => document.getElementById(id);

  const strip = $("phase-strip");
  BANDS.forEach((b, i) => {
    const seg = document.createElement("button");
    seg.className = "phase-seg" + (b.padding ? " padding" : "");
    seg.style.flexGrow = seg.style.flexShrink = String(weights[i]);
    seg.setAttribute("aria-label", `${b.label}, ${b.to - b.from} frames`);
    seg.innerHTML = `<div class="phase-band" style="background:${b.color}"></div>` +
      (i < BANDS.length - 1 ? `<div class="phase-divider"></div>` : "");
    seg.addEventListener("click", () => seek(b.from));
    strip.appendChild(seg);
  });
  const segs = [...strip.children];

  function render() {
    const pct = (toFraction(frame) * 100).toFixed(3) + "%";
    $("scrub-fill").style.width = pct;
    $("scrub-thumb").style.left = pct;
    $("playhead").style.left = pct;
    const a = activeBand(frame);
    segs.forEach((s, i) => s.classList.toggle("active", i === a));
    $("where-phase").textContent = a >= 0 ? BANDS[a].label : "";
    $("where-frame").textContent = String(frame);
    $("time-now").textContent = ((frame - FIRST) / FPS).toFixed(2) + "s";
    $("scrub").setAttribute("aria-valuenow", String(frame));
    $("scrub").setAttribute("aria-valuetext", `frame ${frame}, ${(frame / FPS).toFixed(2)} seconds`);
  }
  $("time-total").textContent = ((LAST - FIRST) / FPS).toFixed(2) + "s";
  function seek(f) { frame = Math.min(LAST, Math.max(FIRST, Math.round(f))); render(); }

  // ---- playback: loops within the window, like the app ----------------------
  function tick(t) {
    if (!playing) return;
    if (lastT) {
      acc += ((t - lastT) / 1000) * FPS * speed;
      const step = Math.floor(acc);
      if (step > 0) {
        acc -= step;
        frame += step;
        if (frame > LAST) frame = FIRST;
        render();
      }
    }
    lastT = t;
    raf = requestAnimationFrame(tick);
  }
  function setPlaying(on) {
    playing = on;
    $("play").classList.toggle("sunk", on);   // pause IS play, pushed in
    $("play").setAttribute("aria-label", on ? "Pause" : "Play");
    $("play-glyph").style.display = on ? "none" : "";
    $("pause-glyph").style.display = on ? "flex" : "none";
    lastT = 0; acc = 0;
    if (on) raf = requestAnimationFrame(tick);
    else if (raf) cancelAnimationFrame(raf);
  }
  $("play").addEventListener("click", () => setPlaying(!playing));

  // ---- speed well: pill slides to index × 42 --------------------------------
  document.querySelectorAll(".segment").forEach((btn, i) => {
    btn.addEventListener("click", () => {
      speed = Number(btn.dataset.speed);
      document.querySelectorAll(".segment").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
      $("well-pill").style.transform = `translateX(${i * 42}px)`;
    });
  });

  // ---- scrub surface --------------------------------------------------------
  const scrub = $("scrub");
  let dragging = false;
  const xToFrame = clientX => {
    const r = scrub.getBoundingClientRect();
    return toFrame((clientX - r.left) / r.width);
  };
  scrub.addEventListener("pointerdown", e => { dragging = true; scrub.setPointerCapture(e.pointerId); seek(xToFrame(e.clientX)); });
  scrub.addEventListener("pointermove", e => { if (dragging) seek(xToFrame(e.clientX)); });
  scrub.addEventListener("pointerup", () => { dragging = false; });
  scrub.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { seek(frame + 1); e.preventDefault(); }
    if (e.key === "ArrowLeft")  { seek(frame - 1); e.preventDefault(); }
    if (e.key === " ")          { setPlaying(!playing); e.preventDefault(); }
  });

  render();
</script>
