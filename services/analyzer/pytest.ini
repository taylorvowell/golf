[pytest]
testpaths = tests
# `tests/` is not a package and conftest.py is imported by name from the test modules, so the
# rootdir has to be importable for `from swingsage import ...` to resolve.
pythonpath = . tests
addopts = -q --strict-markers --tb=short
filterwarnings =
    error::DeprecationWarning:swingsage.*
