plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.frameclock'
version = '0.1.0'

android {
  namespace "expo.modules.frameclock"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // This module owns the app's ONLY media3 pin — expo-video was removed once D50 made this view
  // the sole playback surface. If any dependency ever brings media3 back onto the classpath, the
  // versions must match: two media3 versions fail at runtime, not at build time.
  def androidxMedia3Version = "1.9.0"
  implementation "androidx.media3:media3-exoplayer:${androidxMedia3Version}"
  implementation "androidx.media3:media3-common:${androidxMedia3Version}"
  // Declared rather than leant on transitively: the player supplies its own HTTP data source so
  // the request can carry the session (D50), and that class lives here.
  implementation "androidx.media3:media3-datasource:${androidxMedia3Version}"
}
